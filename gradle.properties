org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# org.gradle.java.home is deliberately not set here. It used to point at
# /opt/android-studio/jbr, which exists on exactly one machine: CI runners and
# every other checkout have a JDK somewhere else, and the property overrode
# whatever they had. Machine-specific paths belong in ~/.gradle/gradle.properties.
